site_name: Quantum little guide
site_description: Bitácora de aprendizaje sobre Quantum Computing y Error Correction
site_author: Gabriela Marissa Mosquera Orellana

theme:
  name: material
  features:
    - toc.follow
    - toc.integrate
    - navigation.sections
    - navigation.top
    - content.code.copy

plugins:
  - search
  - mkdocs-jupyter

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Inicio: index.md
 
  - Investigación:
      - Investigación: investigacion/index.md
      - Pregunta de investigación: investigacion/pregunta.md
      - Descripción de la estancia: investigacion/estancia.md
 
  - Preliminares:
      - 0.1 Complex numbers: preliminares/01_complex_numbers.md
      - 0.2 Euclidean vectors and vector spaces: preliminares/02_euclidean_vectors.md
      - 0.3 Bras and kets: preliminares/03_bras_and_kets.md
      - 0.4 Daggers: preliminares/04_daggers.md
      - 0.5 Geometry: preliminares/05_geometry.md
      - 0.6 Operators: preliminares/06_operators.md
      - 0.7 Eigenvalues and eigenvectors: preliminares/07_eigenvalues.md
      - 0.8 Outer products: preliminares/08_outer_products.md
      - 0.9 The trace: preliminares/09_trace.md
      - 0.10 Some useful identities: preliminares/10_identities.md
      - 0.11 Probabilities: preliminares/11_probabilities.md
 
  - Metodología:
      - Metodología: metodologia/index.md
 
  - Capítulos:
      - 1 Qubits, superposición y entrelazamiento: capitulos/1_qubits.md
      - 2 Compuertas cuánticas y la fragilidad de la información: capitulos/2_quantum_gates.md
      - 3 Códigos clásicos y álgebra lineal binaria: capitulos/3_classic_codes.md
      - 4 El formalismo estabilizador y la extracción de síndromes: capitulos/4_stabilizers.md
      - 5 Códigos CSS y la generación de códigos de superficie: capitulos/5_css_codes.md
      - 6 Grafos de Tanner y la topología de la incidencia: capitulos/6_tanner_graphs.md
      - 7 La familia de códigos qLDPC y el producto de hipergrafos: capitulos/7_family_of_qLDPC_codes.md
      - 8 Grafos de interacción física y arquitecturas de hardware: capitulos/8_physics_interaction_graphs.md
      - 9 Embeddings heurísticos, Estrategias de colocación de qubits: capitulos/9_heuristics_embeddings.md
      - 10 Enrutamiento mediante compuertas SWAP y la sobrecarga de conectividad: capitulos/10_SWAP_gates.md
      - 11 Propagación de errores en simulaciones y análisis final: docs/capitulos/11_error_in_simulations.md
 
  - Resultados:
      - Resultados: resultados/index.md
 
  - Conclusiones:
      - Conclusiones: conclusiones/index.md
 
  - Recursos:
      - Recursos: recursos/index.md
  
  - Glosario: glosario.md